    let channels = JSON.parse(localStorage.getItem('nightwave_channels')) || defaultChannels;
    let currentCategory = 'ALL';
    let currentActiveId = channels.length > 0 ? channels[0].id : 1;

    let currentPage = 1;
    const itemsPerPage = 20;

    const video = document.getElementById('videoPlayer');
    let hls = new Hls();

    function renderCategoryButtons() {
      const bar = document.getElementById('categoriesBar');
      bar.innerHTML = `<button class="cat-btn ${currentCategory === 'ALL' ? 'active' : ''}" onclick="filterCategory('ALL')">ALL CHANNEL</button>`;

      allCategories.forEach(cat => {
        const isActive = currentCategory === cat ? 'active' : '';
        bar.innerHTML += `<button class="cat-btn ${isActive}" onclick="filterCategory('${cat}')">${cat}</button>`;
      });
    }

    function renderChannels() {
      const grid = document.getElementById('channelsGrid');
      grid.innerHTML = '';

      const filtered = currentCategory === 'ALL' 
        ? channels 
        : channels.filter(c => c.categories && c.categories.includes(currentCategory));

      const totalPages = Math.ceil(filtered.length / itemsPerPage) || 1;
      if (currentPage > totalPages) currentPage = totalPages;

      const startIndex = (currentPage - 1) * itemsPerPage;
      const paginatedChannels = filtered.slice(startIndex, startIndex + itemsPerPage);

      paginatedChannels.forEach(ch => {
        const card = document.createElement('div');
        card.className = `channel-card ${ch.id === currentActiveId ? 'active' : ''}`;
        card.onclick = () => playChannel(ch);

        let logoContent = ch.logo 
          ? `<div class="card-logo-wrapper"><img src="${ch.logo}" class="card-logo" alt="${ch.name}"></div>` 
          : `<div class="card-logo-wrapper"><div class="card-text-logo">${ch.textLogo || ch.name}</div></div>`;

        card.innerHTML = `
          ${logoContent}
          <div class="card-name-bar">
            <div class="card-name">${ch.name}</div>
          </div>
        `;
        grid.appendChild(card);
      });

      document.getElementById('pageIndicator').innerText = `Page ${currentPage} of ${totalPages}`;
      document.getElementById('prevBtn').disabled = (currentPage === 1);
      document.getElementById('nextBtn').disabled = (currentPage === totalPages);

      const navControls = document.getElementById('paginationControls');
      if (filtered.length <= itemsPerPage) {
        navControls.style.display = 'none';
      } else {
        navControls.style.display = 'flex';
      }
    }

    function changePage(direction) {
      currentPage += direction;
      renderChannels();
    }

    function playChannel(ch) {
      currentActiveId = ch.id;
      document.getElementById('infoChannelName').innerText = ch.name;
      document.getElementById('infoSource').innerText = ch.m3u8 ? ch.name : "No M3U8 Link Provided";

      renderChannels();

      if (!ch.m3u8) {
        alert("এই চ্যানেলের m3u8 লিংকটি যুক্ত করা হয়নি। অ্যাডমিন প্যানেল থেকে লিংক দিন।");
        return;
      }

      if (Hls.isSupported()) {
        hls.destroy();
        hls = new Hls();
        hls.loadSource(ch.m3u8);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
          video.play().catch(e => console.log("Autoplay blocked:", e));
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = ch.m3u8;
        video.play();
      }
    }

    function filterCategory(cat) {
      currentCategory = cat;
      currentPage = 1;
      renderCategoryButtons();
      renderChannels();
    }

    function toggleFullscreen() {
      if (video.requestFullscreen) video.requestFullscreen();
      else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
      else if (video.msRequestFullscreen) video.msRequestFullscreen();
    }

    function reloadStream() {
      const active = channels.find(c => c.id === currentActiveId);
      if (active) playChannel(active);
    }

    function openModal() {
      renderModalInputs();
      document.getElementById('linkModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('linkModal').style.display = 'none';
    }

    function syncCurrentModalInputs() {
      channels.forEach(ch => {
        const nameInput = document.getElementById(`name_${ch.id}`);
        const m3u8Input = document.getElementById(`m3u8_${ch.id}`);
        const logoInput = document.getElementById(`logo_${ch.id}`);

        if (nameInput) ch.name = nameInput.value;
        if (m3u8Input) ch.m3u8 = m3u8Input.value;
        if (logoInput) ch.logo = logoInput.value;

        const selectedCats = [];
        const checkboxes = document.querySelectorAll(`.cat_checkbox_${ch.id}:checked`);
        if (checkboxes.length > 0) {
          checkboxes.forEach(cb => selectedCats.push(cb.value));
          ch.categories = selectedCats;
        }
      });
    }

    function renderModalInputs() {
      const container = document.getElementById('modalInputs');
      const searchQuery = (document.getElementById('adminSearchInput')?.value || '').toLowerCase().trim();
      container.innerHTML = '';

      channels.forEach((ch, idx) => {
        if (!ch.categories) ch.categories = [];

        if (searchQuery && !ch.name.toLowerCase().includes(searchQuery)) {
          return;
        }

        const group = document.createElement('div');
        group.className = 'channel-input-group';
        group.id = `group_${ch.id}`;

        let checkboxesHTML = '';
        allCategories.forEach(cat => {
          const isChecked = ch.categories.includes(cat) ? 'checked' : '';
          checkboxesHTML += `
            <label>
              <input type="checkbox" class="cat_checkbox_${ch.id}" value="${cat}" ${isChecked}> ${cat}
            </label>
          `;
        });

        group.innerHTML = `
          <div class="channel-input-header">
            <label>Slot #${idx + 1}: Channel Management</label>
            <button class="delete-btn" onclick="removeSlot(${ch.id})">🗑️ Delete Slot</button>
          </div>
          <input type="text" id="name_${ch.id}" value="${ch.name}" placeholder="Channel Name">
          <input type="text" id="m3u8_${ch.id}" value="${ch.m3u8 || ''}" placeholder="Enter M3U8 Stream Link">
          <input type="text" id="logo_${ch.id}" value="${ch.logo || ''}" placeholder="Enter Logo Image URL (PNG Direct Link)">
          <label style="font-size:12px; color:#ffd700; font-weight:bold; margin-top:4px;">Select Categories (Multiple Allowed):</label>
          <div class="categories-checkbox-group">
            ${checkboxesHTML}
          </div>
        `;
        container.appendChild(group);
      });
    }

    function addNewCategory() {
      const input = document.getElementById('newCategoryInput');
      const catName = input.value.trim().toUpperCase();

      if (!catName) {
        alert("ক্যাটাগরির নাম লিখুন!");
        return;
      }

      if (allCategories.includes(catName)) {
        alert("এই ক্যাটাগরি ইতিমধ্যে রয়েছে!");
        return;
      }

      syncCurrentModalInputs();
      allCategories.push(catName);
      localStorage.setItem('nightwave_categories', JSON.stringify(allCategories));
      input.value = '';
      
      renderCategoryButtons();
      renderModalInputs();
      alert(`নতুন ক্যাটাগরি '${catName}' যুক্ত করা হয়েছে!`);
    }

    function addNewSlot() {
      syncCurrentModalInputs();
      
      const newId = Date.now();
      channels.push({
        id: newId,
        name: `Channel ${channels.length + 1}`,
        categories: ["SPORTS"],
        m3u8: "",
        logo: "",
        textLogo: "TV"
      });
      
      renderModalInputs();
      const body = document.getElementById('modalInputs');
      body.scrollTop = body.scrollHeight;
    }

    function removeSlot(id) {
      if (channels.length <= 1) {
        alert("কমপক্ষে একটি চ্যানেল থাকতে হবে!");
        return;
      }
      syncCurrentModalInputs();
      channels = channels.filter(c => c.id !== id);
      renderModalInputs();
    }

    function saveChannels() {
      syncCurrentModalInputs();

      localStorage.setItem('nightwave_channels', JSON.stringify(channels));
      closeModal();
      renderChannels();
      alert("সফলভাবে সমস্ত চ্যানেল, মাল্টি-ক্যাটাগরি এবং লিঙ্ক আপডেট করা হয়েছে!");
    }

    renderCategoryButtons();
    renderChannels();
    if (channels.length > 0) playChannel(channels[0]);
  </script>
